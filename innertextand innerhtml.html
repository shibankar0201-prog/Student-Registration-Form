<!DOCTYPE html> 
<html> 
<body> 
<p id="demo">Hello Student</p> 
<button onclick="changeText()">innerText</button> 
<button onclick="changeHTML()">innerHTML</button> 
<script> 
function changeText() { 
document.getElementById("demo").innerText = 
"Welcome Student"; 
} 
function changeHTML() { 
document.getElementById("demo").innerHTML = 
"<b>Welcome Student</b>"; 
} 
</script> 
</body> 
</html>
