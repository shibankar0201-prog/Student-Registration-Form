<!DOCTYPE html> 
<html> 
<head> 
<style> 
button { 
background: blue; 
color: white; 
padding: 12px 20px; 
border: none; 
border-radius: 5px; 
} 
button:hover { 
background: green; 
} 
</style> 
</head> 
<body> 
<h2>Button Example</h2> 
<button onclick="show()">Click Me</button> 
<script> 
function show() { 
alert("Button Clicked Successfully!"); 
} 
</script> 
</body> 
</html>
