<!DOCTYPE html> 
<html> 
<head> 
<style> 
body { font-family: Arial; background: lightblue; } 
form { 
background: white; 
padding: 20px; 
width: 300px; 
margin: auto; 
} 
input, select { 
width: 100%; 
padding: 8px; 
margin: 8px 0; 
} 
button { 
background: green; 
color: white; 
padding: 10px; 
} 
</style> 
</head> 
<body> 
 
<h2 align="center">Student Registration</h2> 
 
<form> 
    Name: <input type="text" placeholder="Enter 
Name"> 
    Email: <input type="email" placeholder="Enter 
Email"> 
    Password: <input type="password"> 
 
    Gender: 
    <select> 
        <option>Male</option> 
        <option>Female</option> 
    </select> 
 
    Course: 
    <input type="text" placeholder="Enter Course"> 
 
    <button type="submit">Register</button> 
</form> 
 
</body> 
</html>
